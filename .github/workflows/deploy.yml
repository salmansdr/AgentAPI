name: Deploy services

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate services
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/customer-function/requirements.txt
          python -m pip install -r services/order-api/requirements.txt

      - name: Validate OpenAPI documents and Python services
        run: |
          python -m json.tool services/customer-function/openapi.json > /dev/null
          python -m json.tool services/order-api/openapi.json > /dev/null
          python -m py_compile services/customer-function/function_app.py
          python -m py_compile services/order-api/order_service.py

  deploy-development:
    name: Deploy development
    needs: validate
    if: github.event_name == 'push' || inputs.target_environment == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy customer Function App
        run: |
          cd services/customer-function
          zip -r ../../customer-function.zip . -x local.settings.json '__pycache__/*'
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.FUNCTION_RESOURCE_GROUP }}" \
            --name "${{ vars.FUNCTION_APP_NAME }}" \
            --src ../../customer-function.zip \
            --build-remote true

      - name: Build and push Order API image
        id: order_image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          image="${{ vars.ACR_LOGIN_SERVER }}/order-api:${{ github.sha }}"
          docker build --tag "$image" services/order-api
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Update Order API Web App
        run: |
          az webapp config container set \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}" \
            --container-image-name "${{ steps.order_image.outputs.image }}" \
            --container-registry-url "https://${{ vars.ACR_LOGIN_SERVER }}"
          az webapp config set \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'
          az webapp restart \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}"

      - name: Smoke test deployed services
        if: ${{ false }} # Temporarily disabled while deployment endpoint checks are finalized.
        run: |
          function_host=$(az webapp config hostname list \
            --resource-group "${{ vars.FUNCTION_RESOURCE_GROUP }}" \
            --name "${{ vars.FUNCTION_APP_NAME }}" \
            --query "[?contains(name, 'azurewebsites.net')].name | [0]" --output tsv)
          order_host=$(az webapp show \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}" \
            --query defaultHostName --output tsv)
          test -n "$function_host" || { echo "No Azure Functions hostname was found."; exit 1; }
          test -n "$order_host" || { echo "No Order API Web App hostname was found."; exit 1; }
          echo "Testing Function App host: $function_host"
          echo "Testing Order API Web App host: $order_host"
          curl --fail --retry 6 --retry-delay 10 "https://${function_host}/api/customers"
          curl --fail --retry 6 --retry-delay 10 "https://${order_host}/health"

  deploy-production:
    name: Deploy production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy customer Function App
        run: |
          cd services/customer-function
          zip -r ../../customer-function.zip . -x local.settings.json '__pycache__/*'
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.FUNCTION_RESOURCE_GROUP }}" \
            --name "${{ vars.FUNCTION_APP_NAME }}" \
            --src ../../customer-function.zip \
            --build-remote true

      - name: Build and push Order API image
        id: order_image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          image="${{ vars.ACR_LOGIN_SERVER }}/order-api:${{ github.sha }}"
          docker build --tag "$image" services/order-api
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Update Order API Web App
        run: |
          az webapp config container set \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}" \
            --container-image-name "${{ steps.order_image.outputs.image }}" \
            --container-registry-url "https://${{ vars.ACR_LOGIN_SERVER }}"
          az webapp config set \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'
          az webapp restart \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}"

      - name: Smoke test deployed services
        run: |
          function_host=$(az webapp config hostname list \
            --resource-group "${{ vars.FUNCTION_RESOURCE_GROUP }}" \
            --name "${{ vars.FUNCTION_APP_NAME }}" \
            --query "[?contains(name, 'azurewebsites.net')].name | [0]" --output tsv)
          order_host=$(az webapp show \
            --resource-group "${{ vars.ORDER_WEB_APP_RESOURCE_GROUP }}" \
            --name "${{ vars.ORDER_WEB_APP_NAME }}" \
            --query defaultHostName --output tsv)
          test -n "$function_host" || { echo "No Azure Functions hostname was found."; exit 1; }
          test -n "$order_host" || { echo "No Order API Web App hostname was found."; exit 1; }
          echo "Testing Function App host: $function_host"
          echo "Testing Order API Web App host: $order_host"
          curl --fail --retry 6 --retry-delay 10 "https://${function_host}/api/customers"
          curl --fail --retry 6 --retry-delay 10 "https://${order_host}/health"